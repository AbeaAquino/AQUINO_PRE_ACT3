<main class="resume">
  <app-header
    [fullName]="fullName"
    [location]="location"
    [email]="email"
    [phone]="phone"
    [profile]="profile" />

  <div class="content">
    <section>
      <h2>Education</h2>
      <article class="education-card">
        <div class="education-header">
          <div>
            <h3>{{ education.school }}</h3>
            <p class="program">{{ education.program }}</p>
            <p class="school-location">{{ education.location }}</p>
          </div>
          <span class="year-badge">{{ education.year }}</span>
        </div>

        <ul class="highlights">
          @for (item of education.highlights; track item) {
            <li>{{ item }}</li>
          }
        </ul>
      </article>
    </section>

    <app-profile-card />

    <app-skills
      [skills]="skills"
      (skillSelected)="onSkillSelected($event)" />

    <section class="interaction">
      <h2>Angular Interaction</h2>
      <p class="message" aria-live="polite">{{ message() }}</p>
    </section>
  </div>

  <app-footer
    [fullName]="fullName"
    [proficiencies]="proficiencies" />
</main>
